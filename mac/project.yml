name: KotaTaskMac
options:
  bundleIdPrefix: com.mark.kotatask
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "YES"
targets:
  KotaTaskMac:
    type: application
    platform: macOS
    sources:
      - path: KotaTaskMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mark.kotatask.mac
        INFOPLIST_KEY_CFBundleDisplayName: KotaTask
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
  KotaTaskMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KotaTaskMacTests
    dependencies:
      - target: KotaTaskMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mark.kotatask.mac.tests
schemes:
  KotaTaskMac:
    build:
      targets:
        KotaTaskMac: all
        KotaTaskMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KotaTaskMacTests
