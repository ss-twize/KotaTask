plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// ── Подпись релиза ──────────────────────────────────────────────────────────
// Источники значений, в порядке приоритета:
//   1) android/keystore.properties — локальный файл, лежит в .gitignore
//   2) -P свойства в командной строке Gradle
//   3) переменные окружения
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def signingValue = { String key ->
    def v = keystoreProps.getProperty(key) ?: project.findProperty(key) ?: System.getenv(key)
    return (v != null && !v.toString().trim().isEmpty()) ? v.toString().trim() : null
}

def releaseStoreFile = signingValue("RELEASE_STORE_FILE")
def releaseStorePassword = signingValue("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = signingValue("RELEASE_KEY_ALIAS")
def releaseKeyPassword = signingValue("RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.mark.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.kotadevelopment.kotatask"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1-beta"
        testInstrumentationRunner "com.mark.app.FeatureInstrumentation"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // v1 (JAR signing) не включаем: он нужен только для Android < 7.0,
                // а minSdk здесь 26. AGP всё равно его пропускает при minSdk >= 24.
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // Явно, чтобы флаг нельзя было потерять при будущих правках.
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

// ── Защита от выпуска неподписанного релиза ─────────────────────────────────
// Без этого assembleRelease молча отдаёт app-release-unsigned.apk, который
// невозможно ни установить, ни опубликовать.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { t ->
        (t.name.startsWith('assemble') || t.name.startsWith('bundle')) && t.name.contains('Release')
    }
    if (wantsRelease && !hasReleaseSigning) {
        throw new GradleException(
            "Релизная сборка запрошена, но подпись не настроена.\n" +
            "Заполните android/keystore.properties (шаблон: keystore.properties.example):\n" +
            "  RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD"
        )
    }
}

// ── Автоматически копирует APK в папку Builds/ после каждой сборки ──────────
// Имя обязательно содержит buildType: раньше debug и release попадали в
// Builds/ под неразличимыми именами, и debug-сборку легко было залить в стор.
afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.assembleProvider.get().doLast {
            def buildsDir = new File(rootProject.projectDir.parentFile.parentFile, "Builds")
            buildsDir.mkdirs()
            def timestamp = new Date().format("yyyyMMdd_HHmm")
            def version = android.defaultConfig.versionName
            def type = variant.buildType.name
            def apkName = "KotaTask_v${version}_${type}_${timestamp}.apk"
            variant.outputs.all { output ->
                def src = output.outputFile
                if (src.exists()) {
                    def dst = new File(buildsDir, apkName)
                    dst.bytes = src.bytes
                    println "✅ APK сохранён: ${dst.absolutePath}"
                }
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
}
